include=~/.local/share/omarchy/default/mako/core.ini

# macOS 2026 "Tahoe" — Notification Center look
# Derived from style-plan.json components.notifications

text-color=#FFFFFF
border-color=#FFFFFF1A
background-color=#1C1C1EC2
progress-color=#D1D1D6

default-timeout=5000
width=420
height=120
padding=16
margin=12
border-size=1
border-radius=16
outer-margin=10
anchor=top-right
layer=overlay
font=SF Pro Display 12

[urgency=low]
border-color=#FFFFFF1A
text-color=#EBEBF599

[urgency=high]
border-color=#FF453A
text-color=#FFFFFF

[app-name=Spotify]
invisible=1

[mode=do-not-disturb]
invisible=true

[mode=do-not-disturb app-name=notify-send]
invisible=false
